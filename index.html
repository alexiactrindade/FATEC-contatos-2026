<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FATEC Models</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <h1>FATEC Models</h1>
    <p>Cadastro de modelos para desfile</p>
  </header>

  <main>

    <aside id="painel-formulario">

      <h2>Nova Candidata</h2>

      <input type="hidden" id="campo-id">

      <label for="campo-nome"> Nome completo</label>

      <input type="text" id="campo-nome" required>

      <label for="campo-celular"> Celular </label>

      <input type="tel" id="campo-celular" required>

      <label for="campo-email"> E-mail </label>

      <input type="email" id="campo-email">

      <label for="campo-endereco"> Endereço </label>

      <input type="text" id="campo-endereco">

      <label for="campo-cidade"> Cidade  </label>

      <input type="text" id="campo-cidade">

<div class="upload-container">

  <span class="texto-upload">Deixe sua foto para nossa avaliação:</span>

  <input type="file" id="campo-foto" accept="image/*" hidden>

  <label for="campo-foto" class="botao-upload">

    <img 
      id="preview-imagem"
      src="./img/upload.svg"
      alt="Upload de imagem"
    >

  </label>

</div>
        <button type="button" id="botao-salvar" class="botao-salvar"> Salvar </button>

      <button type="button" id="botao-cancelar" class="botao-cancelar"> Cancelar </button>

      <p id="mensagem-feedback"></p>

    </aside>

    <section id="painel-lista">

      <div class="topo-lista">

        <h2>Candidatas</h2>

        <button type="button" id="botao-atualizar" class="botao-carregar">
          Atualizar
        </button>

      </div>

      <table id="tabela-contatos">

        <thead>

          <tr>
            <th>Foto</th>
            <th>Nome</th>
            <th>Celular</th>
            <th>Email</th>
            <th>Endereço</th>
            <th>Cidade</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="corpo-tabela"></tbody>

      </table>

      <p id="mensagem-lista"></p>

    </section>

  </main>

  <footer>
    <p>FATEC São Roque · Programação de Sítios Internet</p>
  </footer>

  <script type="module" src="app.js"></script>

</body>

</html>
